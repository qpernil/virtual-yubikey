[package]
name = "virtual-yubikey"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A privilege-separated virtual YubiKey for Linux USB gadget mode"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["raspberry-pi", "usb-gadget", "functionfs", "yubikey"]
categories = ["development-tools::testing", "hardware-support"]
publish = false

[workspace]
members = ["crates/virtual-yubikey-core"]
resolver = "2"

[dependencies]
libc = "0.2.189"
usb-gadget-worker = { path = "../usb-gadget-supervisor/crates/usb-gadget-worker" }
virtual-yubikey-core = { path = "crates/virtual-yubikey-core" }

[[bin]]
name = "virtual-yubikey-worker"
path = "src/main.rs"

[dev-dependencies]
toml = "0.9.12"

# The USB binary deliberately calls Linux interfaces directly. Protocol and
# emulator dependencies live in the transport-neutral core crate.
