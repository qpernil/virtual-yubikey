[package]
name = "virtual-yubikey"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A privilege-separated virtual YubiKey for Linux USB gadget mode"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["raspberry-pi", "usb-gadget", "functionfs", "yubikey"]
categories = ["development-tools::testing", "hardware-support"]
publish = false

[workspace]
members = ["crates/virtual-yubikey-core", "crates/yubikey-apdu"]
resolver = "2"

[features]
# Build the ordinary worker against simulated I/O for process tests.
worker-harness = ["usb-gadget-worker-io/simulated"]

[dependencies]
libc = "0.2.191"
software-key-core = { path = "../software-key-core", features = ["state-persistence"] }
virtual-yubikey-core = { path = "crates/virtual-yubikey-core" }

[target.'cfg(unix)'.dependencies]
usb-gadget-worker-io = { path = "../usb-gadget-supervisor/crates/usb-gadget-worker-io" }
usb-gadget-worker = { path = "../usb-gadget-supervisor/crates/usb-gadget-worker" }
display-backends = { path = "../display-backends" }

[[bin]]
name = "virtual-yubikey-worker"
path = "src/main.rs"

[dev-dependencies]
usb-gadget-harness = { path = "../usb-gadget-supervisor/crates/usb-gadget-harness" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "precomputed-tables", "std"] }
signature = "3.0.0"
toml = "0.9.12"

# Physical USB uses Linux device handles; process tests use the shared Unix
# handle compatibility layer. Device behavior lives in the core crate.

[[test]]
name = "worker_harness"
path = "tests/worker_harness.rs"
required-features = ["worker-harness"]
