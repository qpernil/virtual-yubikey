[package]
name = "virtual-yubikey"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A privilege-separated virtual YubiKey for Linux USB gadget mode"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["raspberry-pi", "usb-gadget", "functionfs", "yubikey"]
categories = ["development-tools::testing", "hardware-support"]
publish = false

[workspace]
members = ["crates/virtual-yubikey-core", "crates/virtual-yubikey-crypto"]
resolver = "2"

[dependencies]
embedded-graphics = { version = "0.8.2", optional = true }
virtual-yubikey-core = { path = "crates/virtual-yubikey-core" }

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = { version = "0.8.0", optional = true }
spidev = { version = "0.7.1", optional = true }

[features]
display-demo = ["dep:embedded-graphics", "dep:gpiocdev", "dep:spidev"]

[[bin]]
name = "virtual-yubikey-worker"
path = "src/main.rs"

[[bin]]
name = "st7789-embedded-graphics-demo"
path = "src/bin/st7789-embedded-graphics-demo.rs"
required-features = ["display-demo"]

[dev-dependencies]
toml = "0.9.12"

# The USB binary deliberately calls Linux interfaces directly. Protocol and
# emulator dependencies live in the transport-neutral core crate.
