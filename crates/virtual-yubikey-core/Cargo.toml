[package]
name = "virtual-yubikey-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Transport-neutral logical YubiKey emulator"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
const-oid = "0.10.2"
der = { version = "0.8.1", features = ["alloc", "derive", "std"] }
software-key-core = { path = "../../../software-key-core" }
getrandom = "0.4.3"
minicbor = { version = "2.3.0", features = ["alloc"] }
rsa = { version = "0.9.10", default-features = false, features = ["std"] }
signature = "3.0.0"
spki = { version = "0.8.0", features = ["alloc", "std"] }
subtle = "2.6.1"
x509-cert = { version = "0.3.0", default-features = false, features = ["builder", "std"] }
zeroize = "1.9.0"

[dev-dependencies]
ed25519-dalek = "3.0.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "precomputed-tables", "std"] }
signature = "3.0.0"
