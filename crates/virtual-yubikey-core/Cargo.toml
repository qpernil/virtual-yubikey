[package]
name = "virtual-yubikey-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Transport-neutral logical YubiKey emulator"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
software-key-core = { path = "../../../software-key-core" }
getrandom = "0.4.3"
minicbor = { version = "2.3.0", features = ["alloc"] }
subtle = "2.6.1"
zeroize = "1.9.0"

[dev-dependencies]
ed25519-dalek = "3.0.0"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "precomputed-tables", "std"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "precomputed-tables", "std"] }
signature = "3.0.0"
